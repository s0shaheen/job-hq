# Committed defaults for every Config-tab knob. The Config TAB in the sheet
# overrides these (validated per key; invalid values fall back here and get
# reported to ops). bootstrap seeds the Config tab from this file.
#
# NO PERSONA LIVES HERE (RM-40 vault audit §9 Step 4). A default in this file
# governs every instance that never touched the knob, so search-shaping keys —
# titles, seniority band, YoE ceiling, employer denylist — default to UNSET
# and the workers skip that filter loudly rather than inherit anybody's
# search. Operational knobs keep neutral values (UTC, quiet hours off). Each
# user's real search lives in their Config tab / profile.yaml, where it
# always did take precedence.
yoe_push_max: 3            # push any new role whose min required YoE <= this (blank YoE never pushes)
# --- intake gates (WS1): disposition stamped on every feed row at write time ---
filter_countries:          # product scope is US-only (DEC-007), not a preference
  - United States
filter_metros: []          # empty = anywhere in filter_countries; e.g. [Chicago] for a local search
filter_geo_unknown: filter # blank-geo non-remote rows: filter (invisible, recoverable) | keep
filter_comp_min: 0         # $k floor judged on the TOP of a stated range; 0 = off
filter_comp_unknown: keep  # postings stating no comp (~48%): keep | filter
filter_work_model_exclude: []  # substrings of work_model to reject, e.g. [onsite]
filter_yoe_max:            # blank = no ceiling (gate off); a number filters min-YoE above it
filter_yoe_unknown: seniority-proxy  # tagged rows w/o stated YoE: seniority-proxy | keep
filter_seniority_exclude: []  # unset = no seniority is over-bar; name your own ladder's exclusions
# --- daily sweep throughput (monitor.run) ---
fetch_workers: 8           # concurrent board fetches in the daily sweep (network only; sheet writes stay serial)
# --- geo-first aggregator sweep (WS4): "any employer in this metro" ---
wide_location_ids: []      # TheirStack catalog location IDs (blank = company-fenced mode)
wide_credit_budget: 25     # max jobs TheirStack may RETURN per run (1 credit each) — hard spend cap.
                           # 25 = the free tier's per-page cap; paid tiers allow up to 500
# --- referral finder: LinkedIn company ids (monitor.linkedin_backfill, dispatch-only) ---
linkedin_backfill_budget: 20  # companies probed per run = credits spent (limit:1 per probe).
                              # 0 = off, max 50 (TheirStack allows 50 requests/HOUR per key,
                              # and a 400-probe run cannot finish inside Lambda's 900s).
                              # The free harvest in monitor.wide ignores this knob entirely.
run_budget_min: 30         # soft wall-clock budget; the sweep stops starting new chunks past this and flushes
stale_days: 30             # Applied + this many silent days -> stale flag + digest nudge
digest_hour_ct: 7          # daily digest hour, America/Chicago
# --- job tagging throughput/resilience (monitor.review nightly sweep + inline) ---
review_workers: 8          # concurrent JD-fetch+LLM workers in the nightly sweep
tag_retry_max: 2           # in-run retries on a transient fetch/LLM failure (429/5xx/timeout)
tag_deadletter_days: 4     # give up on a row still FAILING this many days after first_seen
untagged_backlog_alert: 50 # ops-alert when this many open rows are still untagged after a sweep (0 = off)
inline_tag_max: 200        # cap on inline JD-fetch+LLM at discovery per run; overflow drains in review
inline_tag_workers: 8      # concurrent inline taggers at discovery
# --- notification policy, per event type (core/channels.py is the choke point) ---
# push | email | both | none. `notify_channel` in users/<name>/profile.yaml is the
# coarse CEILING (email = never an ntfy push for that person); these refine within
# it and can never widen it. Values below are the product's channel routing —
# which surface each event class belongs on — not anybody's preference; a
# user's deviations live in their profile / Config tab.
notify_digest: both          # daily briefing: phone ping + the email
notify_new_roles: push       # discovery sweeps (monitor, priority watch, wide)
notify_status_change: push   # an email event advanced a Pipeline row
notify_oa_interview: push    # OA / interview invite — urgent, ignores quiet hours
notify_stale_nudge: none     # follow-up nudges belong in the digest, not the phone
# Quiet hours: a LOCAL wall-clock window in which a non-urgent push is DEFERRED to
# the end of the window (tracker.outbox delivers it) — never dropped. `off` disables.
# Default OFF: a committed sleep window is one person's clock imposed on
# everyone else's; each user names their own window in their Config tab.
notify_quiet_hours: "off"
notify_timezone: UTC       # which local day and clock the window is read on; UTC until the user says otherwise
push_new_jobs: true
push_status_events: true
simplify_enabled: true
ghost_suggest: true
workday_search: product
# Unset on purpose: a title filter is a search, and a search belongs to a
# user. With titles_include empty the sweep SKIPS loudly (monitor/run.py,
# monitor/wide.py) instead of running somebody else's list; each instance's
# titles come from its Config tab or users/<name>/profile.yaml.
titles_include: []
titles_exclude: []
dna_companies: []         # do-not-apply guard (scout tab flags these); per-user, unset by default
