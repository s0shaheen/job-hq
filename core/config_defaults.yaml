# Committed defaults for every Config-tab knob. The Config TAB in the sheet
# overrides these (validated per key; invalid values fall back here and get
# reported to ops). bootstrap seeds the Config tab from this file.
yoe_push_max: 3            # push any new role whose min required YoE <= this (blank YoE never pushes)
stale_days: 30             # Applied + this many silent days -> stale flag + digest nudge
digest_hour_ct: 7          # daily digest hour, America/Chicago
# --- job tagging throughput/resilience (monitor.review nightly sweep + inline) ---
review_workers: 8          # concurrent JD-fetch+LLM workers in the nightly sweep
tag_retry_max: 2           # in-run retries on a transient fetch/LLM failure (429/5xx/timeout)
tag_deadletter_days: 4     # give up on a row still FAILING this many days after first_seen
untagged_backlog_alert: 50 # ops-alert when this many open rows are still untagged after a sweep (0 = off)
inline_tag_max: 200        # cap on inline JD-fetch+LLM at discovery per run; overflow drains in review
inline_tag_workers: 8      # concurrent inline taggers at discovery
push_new_jobs: true
push_status_events: true
simplify_enabled: true
ghost_suggest: true
workday_search: product
titles_include:
  - product manager
  - associate product manager
  - senior product manager
  - group product manager
  - principal product manager
  - head of product
  - director of product
  - vp of product
  - technical product manager
  - deployment strategist
  - forward deployed
  - product strategist
  - product operations
  - strategic projects
titles_exclude:
  - product marketing
  - product designer
  - product design
  - product analyst
  - data analyst
  - program manager
  - marketing manager
  - pmm
  - intern
dna_companies:            # do-not-apply guard (scout tab flags these)
  - Capital One
  - Discover
  - Bank of America
  - Citi
