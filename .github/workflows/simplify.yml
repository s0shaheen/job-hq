# Twice-daily best-effort Simplify sync (cookie API -> Pipeline), plus the
# committed CSV export as a second source when present. Ad-hoc trigger: GitHub
# app -> Actions -> "Simplify import" -> Run workflow. Never load-bearing: a
# dead token alerts once and everything else is unaffected.
# Re-auth: docs/RUNBOOK.md § Simplify.
name: Simplify import

# SCHEDULE RETIRED 2026-07-25 — and deliberately NOT re-created on Lambda (#56): the cookie API
# needs simplify.jobs session cookies that expire every few weeks, i.e. a secret you babysit
# forever, and the same applications already reach Pipeline via Gmail capture. Kept dispatchable:
# refresh the two secrets per docs/RUNBOOK.md § Simplify re-auth and run it when you want a sweep.
on:
  workflow_dispatch: {}


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-simplify-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Import (cookie API; skips cleanly until secrets are set)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          SIMPLIFY_AUTH_COOKIE: ${{ secrets.SIMPLIFY_AUTH_COOKIE }}
          SIMPLIFY_CSRF: ${{ secrets.SIMPLIFY_CSRF }}
        run: python -m tracker.simplify
      - name: Import (committed CSV export, second source)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
        run: python -m tracker.migrate --simplify-csv
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Simplify import failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
