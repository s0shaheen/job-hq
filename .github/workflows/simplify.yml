# Daily best-effort Simplify import (saved queue -> Pipeline Inbox rows).
# Never load-bearing: a dead token alerts once and everything else is
# unaffected. Re-auth: docs/RUNBOOK.md § Simplify.
name: Simplify import

on:
  schedule:
    - cron: "7 14 * * *"   # ~09:07 America/Chicago
  workflow_dispatch: {}

concurrency:
  group: hq-simplify
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Import
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SIMPLIFY_AUTH_COOKIE: ${{ secrets.SIMPLIFY_AUTH_COOKIE }}
          SIMPLIFY_CSRF: ${{ secrets.SIMPLIFY_CSRF }}
        run: python -m tracker.simplify
      - name: Ops alert on failure
        if: failure()
        run: |
          curl -s -H "Title: Simplify import failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
