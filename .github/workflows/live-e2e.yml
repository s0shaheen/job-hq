# The live-data browser lane (`docs/pilot-launch/17-ui-verification-standard.md` §5).
#
# The only thing in this estate that drives the real UI against real Postgres:
# real Supabase sessions, real `entitlements` rows, real RLS. Everything else in
# CI runs `HQ_DEMO=1` against `FixtureDataSource`.
#
# NOT ON PULL REQUESTS, and that is §5's instruction rather than a shortcut. It
# needs the test project's service_role key, and a workflow that hands a
# database-destroying credential to code from a fork is a supply-chain hole. It
# is also slow: a build, a seed, a teardown. Fixture mode stays the fast inner
# loop; this runs after the merge and before a release. (#178 proposed gating
# pull requests with it; #228 rejected that. If per-PR coverage is ever wanted,
# it joins the full-run label lane — never every PR.)
#
# Two hygiene properties, both salvaged from #178 because they are true on any
# trigger:
#
#   NAMESPACE — every row a run creates carries `HQ_LIVE_SEED_NAMESPACE`
#   (`main` here, `local` on a laptop), and teardown is scoped to it, so a
#   developer's run and CI can never delete each other's rows. What a
#   cancelled run abandons is reclaimed: the same namespace's next seed tears
#   it down exactly, and an age-based reaper reclaims namespaces nobody seeds
#   again. See `webapp/tests/live/seed-plan.ts`.
#
#   THE SERVICE_ROLE KEY — when the secret is absent (a rotation that dropped
#   it, a fork if a PR trigger is ever added), this lane does not quietly
#   skip: it FAILS, loudly, in its first step. A lane that passes because it
#   could not authenticate is an empty gate wearing a green check.
name: live e2e

on:
  push:
    branches: [main]
    # Only when something that can break the live path moved. The lane costs a
    # seed and a teardown against a shared project, and running it for a docs
    # commit buys nothing while making two merges collide over the same four
    # synthetic users.
    paths:
      - "webapp/**"
      - "db/migrations/**"
      - ".github/workflows/live-e2e.yml"
  # Before a release, and for a deliberate re-run after provisioning.
  workflow_dispatch: {}

concurrency:
  # NOT cancel-in-progress. A cancelled run skips its teardown; the namespace
  # design means the next seed reclaims what it left rather than failing on
  # it, but a cancelled main run is still a live-path regression nobody
  # measured. Queue instead. Queueing is also what lets the whole lane share
  # the single `main` namespace: two runs of this workflow can never overlap.
  group: live-e2e
  cancel-in-progress: false

jobs:
  live:
    name: live-data lane
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # `main` only, restated as a condition. `push.branches` already says so, but
    # `workflow_dispatch` does not, and this job holds a service_role key.
    if: github.ref == 'refs/heads/main'
    env:
      # THE NAMESPACE every row this run creates will carry.
      #
      # A literal, because every run this workflow can start IS main: the
      # trigger is push[main] plus dispatch, and the job condition above pins
      # the dispatch to main too. It must never be `local` — that is the
      # laptop default, and CI sharing it would let a developer's run and CI
      # delete each other's rows mid-journey, which is the collision the
      # namespace exists to prevent. Stable per lane rather than per run, so a
      # re-run reclaims what a cancelled predecessor abandoned instead of
      # accumulating a fresh dead set of five users. `assertNamespace` refuses
      # a malformed value at config load. See webapp/tests/live/seed-plan.ts.
      HQ_LIVE_SEED_NAMESPACE: main
    defaults:
      run:
        working-directory: webapp
    steps:
      # THE CREDENTIAL REFUSAL, BEFORE THE CHECKOUT.
      #
      # Without the service_role key this lane cannot seed, and a lane that
      # cannot run must not report anything a merge path could mistake for a
      # pass. The tempting shape is `if: <secret present>`, which makes the
      # job SKIP — and a skipped-and-therefore-neutral live lane among a dozen
      # green checks is the empty-check-set hole, one job wide. So the step is
      # UNCONDITIONAL and exits 1, first, before anything else runs.
      #
      # Gated on the SECRET being absent because absent credentials are the
      # actual hazard whatever the cause: a rotation that dropped the secret
      # reads exactly like a repository that never had it, and neither may
      # read as a pass. (A fork pull request would be the same failure with a
      # third cause, if a PR trigger ever existed here — it must not, per
      # #228.)
      #
      # `working-directory: .` because the job default is `webapp`, which does
      # not exist until the checkout below.
      - name: Refuse to pass without the test project's credentials
        working-directory: .
        env:
          HAS_KEY: ${{ secrets.HQ_LIVE_SUPABASE_SERVICE_KEY != '' }}
        run: |
          set -euo pipefail
          if [ "${HAS_KEY}" = "true" ]; then
            echo "live lane credentials are present"
            exit 0
          fi
          echo "::error title=Live lane is not configured::HQ_LIVE_SUPABASE_SERVICE_KEY is unset on this repository, so the only gate that can prove RLS, entitlement and real sessions reach the rendered UI cannot run — and it will not report a success it did not earn. See webapp/tests/live/README.md section 1.6."
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm install --no-audit --no-fund

      # THE REFUSAL, BEFORE ANYTHING ELSE.
      #
      # `readLiveEnv` throws on a missing secret and on a URL or key naming the
      # production project, and Playwright resolves it at config load — so the
      # run below already cannot proceed unsafely. This step exists so the
      # failure is READABLE: "the secret is not set" rather than a stack trace
      # inside a config file, on the one workflow whose misconfiguration is
      # destructive.
      - name: Refuse to run unconfigured or against production
        env:
          HQ_LIVE_E2E: "1"
          HQ_LIVE_SUPABASE_URL: ${{ secrets.HQ_LIVE_SUPABASE_URL }}
          HQ_LIVE_SUPABASE_ANON_KEY: ${{ secrets.HQ_LIVE_SUPABASE_ANON_KEY }}
          HQ_LIVE_SUPABASE_SERVICE_KEY: ${{ secrets.HQ_LIVE_SUPABASE_SERVICE_KEY }}
          HQ_LIVE_SEED_PASSWORD: ${{ secrets.HQ_LIVE_SEED_PASSWORD }}
        # `--list` loads the very config the real run loads, which is where
        # `readLiveEnv` lives. Reusing the shipped path rather than a parallel
        # copy of the check is the point: a preflight with its own idea of the
        # rules is a preflight that can disagree with the thing it gates. It
        # resolves the NAMESPACE too (`assertNamespace`, which refuses a token
        # that would break the teardown predicates), and the namespace is
        # echoed so a leaked row can be attributed to the run that made it.
        run: |
          echo "seed namespace: ${HQ_LIVE_SEED_NAMESPACE}"
          npx playwright test --list

      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Seeding, the run, and teardown are all inside `playwright test`:
      # `globalSetup` seeds and mints sessions, `globalTeardown` deletes them.
      # Teardown runs on failure too, and seeding tears its own namespace down
      # first — and REAPS any namespace an earlier cancelled run abandoned more
      # than two hours ago — so an abandoned run costs a message rather than a
      # manual cleanup.
      - name: Run the live-data lane
        env:
          HQ_LIVE_E2E: "1"
          HQ_LIVE_SUPABASE_URL: ${{ secrets.HQ_LIVE_SUPABASE_URL }}
          HQ_LIVE_SUPABASE_ANON_KEY: ${{ secrets.HQ_LIVE_SUPABASE_ANON_KEY }}
          HQ_LIVE_SUPABASE_SERVICE_KEY: ${{ secrets.HQ_LIVE_SUPABASE_SERVICE_KEY }}
          HQ_LIVE_SEED_PASSWORD: ${{ secrets.HQ_LIVE_SEED_PASSWORD }}
        run: npx playwright test

      # A lane that runs zero tests and exits 0 is the failure this whole branch
      # exists to prevent, and Playwright exits 0 on an empty run. The report is
      # read back and the count asserted, so "green" cannot mean "nothing ran".
      - name: The lane actually ran something
        if: always()
        run: node scripts/live-postflight.mjs live-report.json

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-e2e-traces
          path: webapp/test-results/
          retention-days: 7

      # Same page as every other main-branch alarm. A silent failure here means
      # the estate quietly stops verifying the live path — which is the state it
      # was in before this lane existed, and the state nobody noticed.
      - name: Page the ops topic on failure
        if: failure()
        env:
          HQ_OPS_NTFY_TOPIC: ${{ secrets.HQ_OPS_NTFY_TOPIC }}
        run: |
          if [ -z "${HQ_OPS_NTFY_TOPIC}" ]; then
            echo "::error title=Cannot page::HQ_OPS_NTFY_TOPIC is unset, so a failed live lane is silent"
            exit 1
          fi
          curl -fsS -H "Title: live-data lane failed on main" -H "Priority: high" \
            -d "The live-data browser lane failed on main. RLS, entitlement or the real session path may be broken: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${HQ_OPS_NTFY_TOPIC}" || true
