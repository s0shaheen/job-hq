# hiring.cafe coverage sweep (via the Apify actor).
#
# SEPARATE from TheirStack on purpose. They share nothing but a
# destination — different vendor, cost model, latency and failure mode.
# Apify's .call() blocks on a server-side run that can sit QUEUED for
# minutes; when both sources lived in one job, one queued run consumed the
# entire budget and TheirStack was never called at all. Independent
# sources get independent jobs, timeouts and alerts. They still share the
# per-user feed concurrency lane, so their appends serialize.
name: Wide sweep — hiring.cafe

on:
  schedule:
    - cron: "30 13 * * *"   # ~08:30 America/Chicago
  workflow_dispatch: {}


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-feed-writers-${{ matrix.user }}   # shared feed lane: appends serialize, failures don't
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15   # its own budget; a stall here cannot starve TheirStack
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Sweep
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          PYTHONUNBUFFERED: "1"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
        run: python -m monitor.wide --source cafe
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Wide sweep failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
