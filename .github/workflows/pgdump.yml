# DISABLED by PKT-DUMP-DISABLE (FP-OPS-001): no database dump may enter Git.
#
# This workflow used to pg_dump the production public schema and COMMIT the
# gzipped SQL to snapshots/pg/ nightly. Under the pilot-launch containment
# packet (docs/pilot-launch/instances/PKT-DUMP-DISABLE.md) that lane is closed:
# no schedule, no manual dispatch, no configuration toggle here can produce or
# push a dump. The PGDUMP_ENABLED repo variable is intentionally ignored.
#
# What remains tracked (snapshots/pg/hq.sql.gz and its history) is preserved
# as incident evidence; deleting it or rotating SUPABASE_DB_URL is a separate
# owner-approved packet (docs/pilot-launch/packets/00-baseline-and-containment.md).
# The replacement backup — pg_dump to the versioned S3 bucket, never git —
# ships as its own packet; until it does, tracker.digest's `pgdump` lane
# correctly reports the store as having no watched backup under
# HQ_PG_WRITES=first_class.
#
# The file stays (rather than being deleted) so the workflow name remains
# claimed and this pointer is where the next person looks.
name: PG snapshot

on:
  workflow_dispatch: {}   # kept only so the file is valid workflow YAML;
                          # the single job below refuses to do anything.

permissions: {}

jobs:
  disabled:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Refuse
        run: |
          echo "::error title=PG snapshot is disabled::Dumps must not enter Git (FP-OPS-001). See docs/pilot-launch/instances/PKT-DUMP-DISABLE.md"
          exit 1
