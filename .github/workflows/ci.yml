# Tests on every push/PR + the live adapter smoke test on dispatch.
# The smoke job verifies every ATS adapter from a real runner (datacenter
# egress differs from residential — this is the check that matters).
name: CI

# Push builds MAIN only — a PR branch is already built by the pull_request
# event, and the old branches:["**"] made every PR commit run the entire
# matrix TWICE (observed as paired checks on every PR all through 2026-07-26;
# ~28 runner-minutes a push where 14 do). Stale runs on the same ref cancel.
on:
  push:
    branches: [main]
    paths-ignore: ["monitor/snapshots/**", "snapshots/**"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      smoke:
        description: "Also run the live adapter smoke test"
        type: boolean
        default: true
      whoami:
        description: "Print the service account client_email"
        type: boolean
        default: false
      bootstrap:
        description: "Bootstrap the HQ sheet (branch-side control until merge)"
        type: boolean
        default: false
      seed_companies:
        description: "Seed Companies tab during bootstrap"
        type: boolean
        default: true
      migrate_legacy:
        description: "Migrate legacy Jobs data during bootstrap"
        type: boolean
        default: false
      migrate_simplify:
        description: "Import the committed Simplify tracker CSV into Pipeline"
        type: boolean
        default: false
      seed_jobs:
        description: "Run full discovery now (all companies) + tag — seeds the Feed"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  webapp:
    name: webapp
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded: the e2e suite is the long pole (11.3m of a 13.7m job at 628
    # tests x 2 projects on 2 cores) AND the contention that starved the
    # pipeline write test — 42 import-wizard tests parse workbooks against the
    # same next-start the rest of the suite is talking to. Two shards halve
    # both. The build/vitest half is repeated per shard (~2m); wall clock still
    # drops ~14m -> ~7-8m and the per-shard server load drops with it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      # `npm install`, not `npm ci`, on purpose. Tailwind v4's native oxide
      # binary pulls a DIFFERENT set of platform-optional packages on
      # linux-x64 than on darwin-arm64 (the @emnapi/* tree), and npm cannot
      # reliably record both in one lockfile — the same friction esbuild,
      # rollup and sharp all hit. `npm ci` therefore fails on a lockfile that
      # is otherwise correct. Versions stay pinned by the lockfile; what is
      # given up is the strict in-sync assertion, which here only ever fired
      # as a false alarm.
      - run: npm install --no-audit --no-fund
      - run: npm run lint:copy
        if: matrix.shard == 1
      - run: npm run typecheck
      - run: npm run build
        env:
          HQ_DEMO: "1"
      - run: npm test
        if: matrix.shard == 1   # unit tests are shard-independent; once is enough
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The design law, enforced against the RENDERED page.
      #
      # `lint:copy` above reads source strings; this reads computed styles, and
      # the two catch disjoint sets — a text-transform inherited from a parent,
      # a gradient arriving through a stylesheet, an em dash that came in with
      # the data. Named as its own step rather than left to the sharded run
      # below purely for legibility: this is the first gate in the integration
      # order, and "design law violated" has to be readable without paging
      # through a thousand functional tests. ~25s, shard 1 only.
      - name: Anti-slop computed-style sweep
        if: matrix.shard == 1
        run: npx playwright test tests/e2e/slop.spec.ts
        env:
          HQ_DEMO: "1"
      # The layout suite is the guarantee that no page ever scrolls sideways,
      # at six widths on three pages. Visual snapshots are skipped until Linux
      # baselines are recorded (see tests/e2e/visual.spec.ts).
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          HQ_DEMO: "1"
      # test-results/ is where the on-first-retry TRACES land (playwright.config
      # trace setting); the github reporter never writes playwright-report/, so
      # the old path uploaded nothing — seven CI failures of one chronic flake
      # left zero artifacts to diagnose from. The trace zip is the diagnosis.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: webapp/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Visual regression, in the ONE environment its baselines were recorded in.
  #
  # Font rasterisation differs between machines, so a pixel baseline is only
  # meaningful where the fonts match. This job runs inside the official
  # Playwright container — the exact image the committed `-linux` baselines were
  # recorded in — and sets HQ_VISUAL=1 to un-skip visual.spec.ts. The bare
  # `webapp` job above leaves HQ_VISUAL unset and skips it, so a font mismatch
  # can never turn that job permanently red. Separate job so a real visual diff
  # is legible on its own, not buried in the functional run.
  visual:
    name: visual (Playwright container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm install --no-audit --no-fund
      - name: Visual snapshots
        env:
          HQ_VISUAL: "1"
          HQ_DEMO: "1"
        run: npx playwright test tests/e2e/visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: webapp/playwright-report/
          retention-days: 7

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q

  # The migrations, actually executed. tests/core/test_migrations.py reads the
  # SQL as text — enough to catch a function the app calls but nobody defined,
  # and blind to every logic error in the function body. This job applies the
  # schema to a real Postgres and runs the write path: idempotent replay,
  # optimistic concurrency, and the two-concurrent-writers race that acceptance
  # criterion 26 describes. None of that had ever been executed anywhere.
  db:
    name: db (migrations on real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Without this the job races the container and fails on connect.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt "psycopg[binary]==3.2.3"
      - name: Apply migrations and exercise the write path
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          # Turns a missing DATABASE_URL into a hard failure instead of a
          # suite that skips every test and reports green.
          HQ_REQUIRE_DB: "1"
        run: pytest tests/db -q

  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Live adapter smoke (from datacenter egress)
        run: python -m monitor.scripts.smoke_adapters

  whoami:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.whoami }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print client_email
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        # base64 so GitHub's secret masking doesn't redact it (it's a substring
        # of the JSON secret); client_email is an identifier, not a credential.
        run: python3 -c "import json,os,base64; print('SA_EMAIL_B64=' + base64.b64encode(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])['client_email'].encode()).decode())"

  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Bootstrap HQ sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          SA_EMAIL=$(python -c "import json,os; print(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])['client_email'])")
          SHEET_ID=$(python -c "import yaml; print(yaml.safe_load(open('hq.config.yaml'))['sheet_id'])")
          ARGS="--sheet-id $SHEET_ID --owner shaheensalmant@gmail.com --sa-email $SA_EMAIL"
          if [ "${{ inputs.seed_companies }}" = "true" ]; then ARGS="$ARGS --seed-companies"; fi
          python -m tracker.bootstrap $ARGS
      - name: Migrate history (legacy sheet + committed import CSVs)
        if: ${{ inputs.migrate_legacy }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.migrate --legacy --scout-csv --applog tracker/data/applog-import.csv
      - name: Commit gid registry
        run: |
          git config user.name "hq-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add hq.config.yaml || true
          git commit -m "chore: pin HQ sheet gids from bootstrap" || echo "no changes"
          git push || echo "nothing to push"

  migrate_simplify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_simplify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Import Simplify tracker CSV
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.migrate --simplify-csv

  seed_jobs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      # feed lanes are per-user now; this manual seed targets the default user
      group: hq-feed-writers-${{ vars.HQ_DEFAULT_USER || 'salman' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Full discovery sweep (all monitored companies)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.run
      - name: Tag any roles discovery left untagged
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.review
