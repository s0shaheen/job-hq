# Tests on every push/PR + the live adapter smoke test on dispatch.
# The smoke job verifies every ATS adapter from a real runner (datacenter
# egress differs from residential — this is the check that matters).
name: CI

# Push builds MAIN only — a PR branch is already built by the pull_request
# event, and the old branches:["**"] made every PR commit run the entire
# matrix TWICE (observed as paired checks on every PR all through 2026-07-26;
# ~28 runner-minutes a push where 14 do). Stale runs on the same ref cancel.
on:
  push:
    branches: [main]
    paths-ignore: ["monitor/snapshots/**", "snapshots/**"]
  pull_request: {}
  workflow_dispatch:
    inputs:
      smoke:
        description: "Also run the live adapter smoke test"
        type: boolean
        default: true
      whoami:
        description: "Print the service account client_email"
        type: boolean
        default: false
      bootstrap:
        description: "Bootstrap the HQ sheet (branch-side control until merge)"
        type: boolean
        default: false
      seed_companies:
        description: "Seed Companies tab during bootstrap"
        type: boolean
        default: true
      migrate_legacy:
        description: "Migrate legacy Jobs data during bootstrap"
        type: boolean
        default: false
      migrate_simplify:
        description: "Import the committed Simplify tracker CSV into Pipeline"
        type: boolean
        default: false
      seed_jobs:
        description: "Run full discovery now (all companies) + tag — seeds the Feed"
        type: boolean
        default: false

# Checked against 2026-08-03's runs rather than reasoned about, because the
# cancellations that day were read as waste and are mostly not:
#
#   PULL REQUESTS. `github.ref` is `refs/pull/<N>/merge`, which is stable for the
#   life of the PR, so the group is per-PR and a new push cancels its own
#   predecessor rather than racing it. That is what the 56 cancelled PR runs are:
#   e.g. feat/digest-pg-sources pushed four times inside four minutes and each
#   push killed the run before it (27s, 52s, 4m). Working as intended.
#
#   MAIN. cancel-in-progress is false, so main runs QUEUE instead. GitHub keeps
#   at most one pending run per group, and cancels the pending one when another
#   arrives — which is what the 9 cancelled main runs are. Checked run
#   30836617848: `cancelled`, and zero jobs, so zero billed minutes. It never
#   started. Nothing to reclaim there.
#
# So the bill is not cancellation waste, it is that every run that DID execute
# ran every gate. That is what the `select` job below addresses.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────
  # Which of the gate jobs below can this diff possibly have broken?
  #
  # WHY. Billed minutes accrue PER JOB, so every run cost the same ~40 runner-
  # minutes whatever changed — a docs-only commit ran the entire browser suite
  # twice. Measured on run 30846546842: webapp shard 1 850s, shard 2 688s,
  # pinned mutants 240s, visual 169s, tests 125s, db 85s, render 36s. There
  # were 155 pull-request runs on 2026-08-03.
  #
  # WHERE THE MAP IS. `path_map` in scripts/verify.sh — the SAME map the local
  # change-scoped lane resolves, queried through `--print-ci-jobs`. Not a second
  # copy in this file: two path maps drift, and the drift is silent in both
  # directions. tests/core/test_ci_selection.py fails if this file and that map
  # stop agreeing about which jobs exist or what gates them.
  #
  # WHY IT HAS NO `if:` AND NEVER WILL. scripts/land.sh refuses to merge when a
  # pull request's check set is empty, and again when NONE of its checks passed
  # (exit 10) — the guard that would have stopped #108 and #109 landing on a red
  # main. A skipped job does still appear in `gh pr checks`, with bucket
  # `skipping` (verified against PR #174's five dispatch-only jobs), but
  # `skipping` is not `pass`. So a docs-only pull request whose every gate
  # skipped would present nothing but skips and land.sh would refuse it — a
  # refusal aimed at a merge-over-red, fired at a prose change. This job is the
  # check that passes, which keeps that refusal meaning what it says.
  select:
    name: select (which gates this diff can break)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      webapp:  ${{ steps.pick.outputs.webapp }}
      visual:  ${{ steps.pick.outputs.visual }}
      tests:   ${{ steps.pick.outputs.tests }}
      render:  ${{ steps.pick.outputs.render }}
      db:      ${{ steps.pick.outputs.db }}
      mutants: ${{ steps.pick.outputs.mutants }}
    steps:
      # fetch-depth 0: the selection is a diff against the base branch, and a
      # shallow clone has no merge base to diff against. ci-select.sh fetches the
      # base ref explicitly on top of this and falls back to the FULL set if it
      # cannot.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: pick
        run: scripts/ci-select.sh

  webapp:
    name: webapp
    needs: select
    if: needs.select.outputs.webapp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sharded: the e2e suite is the long pole (11.3m of a 13.7m job at 628
    # tests x 2 projects on 2 cores) AND the contention that starved the
    # pipeline write test — 42 import-wizard tests parse workbooks against the
    # same next-start the rest of the suite is talking to. Two shards halve
    # both. The build/vitest half is repeated per shard (~2m); wall clock still
    # drops ~14m -> ~7-8m and the per-shard server load drops with it.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      # `npm install`, not `npm ci`, on purpose. Tailwind v4's native oxide
      # binary pulls a DIFFERENT set of platform-optional packages on
      # linux-x64 than on darwin-arm64 (the @emnapi/* tree), and npm cannot
      # reliably record both in one lockfile — the same friction esbuild,
      # rollup and sharp all hit. `npm ci` therefore fails on a lockfile that
      # is otherwise correct. Versions stay pinned by the lockfile; what is
      # given up is the strict in-sync assertion, which here only ever fired
      # as a false alarm.
      - run: npm install --no-audit --no-fund
      - run: npm run lint:copy
        if: matrix.shard == 1
      # The coverage ledger: which surface states are unverified, as a command.
      # Beside lint:copy because it is the same kind of gate — cheap, static,
      # and answering a question that otherwise needs an investigation. It
      # fails on a `missing` cell for a routed surface that is not in the dated
      # baseline, on a `covered` cell whose cited test title no longer exists,
      # so renaming a test cannot silently uncover a state, and on a citation
      # whose test never drives the cited surface's route — which is a stronger
      # claim than the title resolving, and which caught six cells that read
      # covered while naming a sweep that never loaded them.
      - name: UI coverage ledger
        if: matrix.shard == 1
        run: npm run coverage:ledger
      # The rendered ledger is committed, so a diff shows exactly which states
      # a change covered or abandoned. A stale checked-in copy is a coverage
      # claim nobody regenerated.
      - name: The committed ledger is current
        if: matrix.shard == 1
        run: git diff --exit-code -- ../docs/pilot-launch/evidence/ui-coverage.md
      - run: npm run typecheck
      - run: npm run build
        env:
          HQ_DEMO: "1"
      # And again WITHOUT HQ_DEMO, because that is the artifact production
      # actually serves. `HQ_DEMO` is build-time inlined and swaps the whole
      # auth path for fixtures, so a demo-only build type-checks and bundles
      # code the real app never runs — and leaves the real middleware, session
      # reads, and Supabase client wiring untested until a deploy. The baseline
      # report named this: tested artifact != shipped artifact. Shard 2 so the
      # two builds run concurrently rather than serially.
      - name: Build in production mode (no HQ_DEMO)
        if: matrix.shard == 2
        run: npm run build
      - run: npm test
        if: matrix.shard == 1   # unit tests are shard-independent; once is enough
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # The design law, enforced against the RENDERED page.
      #
      # `lint:copy` above reads source strings; this reads computed styles, and
      # the two catch disjoint sets — a text-transform inherited from a parent,
      # a gradient arriving through a stylesheet, an em dash that came in with
      # the data. Named as its own step rather than left to the sharded run
      # below purely for legibility: this is the first gate in the integration
      # order, and "design law violated" has to be readable without paging
      # through a thousand functional tests.
      #
      # SHARD 2, not shard 1, and that is the whole of the shard rebalance.
      # Measured on run 30846546842: the Playwright shards themselves are already
      # even (532s vs 529s) — the 162s spread between the two JOBS (850s vs 688s)
      # is entirely the unsharded work bolted onto each. Shard 1 carried lint:copy,
      # the ledger, vitest (102s) and this sweep (97s); shard 2 carried only the
      # extra production build (39s). Moving the 97s sweep across leaves ~176s of
      # extras on shard 1 against ~208s on shard 2 — the closest the discrete
      # pieces get to even — and drops the pair's wall clock from 850s to ~785s.
      # Nothing runs less: this is the same step, in the other job.
      - name: Anti-slop computed-style sweep
        if: matrix.shard == 2
        run: npx playwright test tests/e2e/slop.spec.ts
        env:
          HQ_DEMO: "1"
      # The layout suite is the guarantee that no page ever scrolls sideways,
      # at six widths on three pages. Visual snapshots are skipped until Linux
      # baselines are recorded (see tests/e2e/visual.spec.ts).
      - run: npx playwright test --shard=${{ matrix.shard }}/2
        env:
          HQ_DEMO: "1"
      # test-results/ is where the on-first-retry TRACES land (playwright.config
      # trace setting); the github reporter never writes playwright-report/, so
      # the old path uploaded nothing — seven CI failures of one chronic flake
      # left zero artifacts to diagnose from. The trace zip is the diagnosis.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-shard-${{ matrix.shard }}
          path: webapp/test-results/
          retention-days: 7
          if-no-files-found: warn

  # Visual regression, in the ONE environment its baselines were recorded in.
  #
  # Font rasterisation differs between machines, so a pixel baseline is only
  # meaningful where the fonts match. This job runs inside the official
  # Playwright container — the exact image the committed `-linux` baselines were
  # recorded in — and sets HQ_VISUAL=1 to un-skip visual.spec.ts. The bare
  # `webapp` job above leaves HQ_VISUAL unset and skips it, so a font mismatch
  # can never turn that job permanently red. Separate job so a real visual diff
  # is legible on its own, not buried in the functional run.
  visual:
    name: visual (Playwright container)
    needs: select
    if: needs.select.outputs.visual == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      - run: npm install --no-audit --no-fund
      - name: Visual snapshots
        env:
          HQ_VISUAL: "1"
          HQ_DEMO: "1"
        run: npx playwright test tests/e2e/visual.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-report
          path: webapp/playwright-report/
          retention-days: 7

  tests:
    needs: select
    if: needs.select.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth 0 because tests/core/test_ci_selection.py runs ci-select.sh
      # against this checkout's real diff, and a shallow clone has no merge base
      # with origin/main. The first run of that test proved the point the hard
      # way: on `fetch-depth: 1` the selector fell back to the full set with
      # "the diff against origin/main would not compute". That is the fail-open
      # working, and it is also exactly the silent, permanent over-run this test
      # exists to catch — nothing goes red, the economy just quietly stops.
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: pytest -q
      # The assertion-strength lint, in the same job as the suite it reads.
      # Stdlib only, under a second, and it fails on a NEW weak test while
      # holding the dated baseline of pre-existing ones. See the module
      # docstring in scripts/assertion_lint.py for why this is owned here
      # rather than taken from a plugin.
      - name: Assertion-strength lint
        run: python scripts/assertion_lint.py

  # The résumé render service, against the real rendercv it ships with.
  #
  # A SEPARATE JOB because it cannot join the one above: rendercv 2.8 requires Python >= 3.12
  # and the bots' requirements.txt is 3.11, so tests/infra/test_render_live.py SKIPS in `tests`
  # by design. Its two vulnerability tests (theme-folder RCE, photo-URL SSRF) re-derive both
  # vectors from the installed library — they are the check that the double the 3.11 suite uses
  # still matches reality, and the gate that says the render image may ship. A skipped security
  # test is not a passed one, so this job exists to make sure neither ever only skips.
  #
  # The per-theme one-page gate runs here too: it renders the reference fixture in all nine
  # themes and fails loudly, by name, on any theme that spills to a second page.
  render:
    name: render service (rendercv 2.8 on 3.12)
    needs: select
    if: needs.select.outputs.render == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      # rendercv[full] is pure-pip (bundled Typst + fonts) — no apt packages needed. The repo's
      # requirements.txt goes in too, and only for tests/conftest.py: the global no-real-ntfy
      # guard imports core.notify, so a job without `requests` cannot collect ANY test under
      # tests/. It is not in the image — infra/render/Dockerfile copies neither.
      - run: pip install -r requirements.txt -r infra/render/requirements.txt
      # -p no:cacheprovider + explicit paths: this job installs a DIFFERENT dependency set than
      # the repo suite, so it must never collect tests/ wholesale (gspread and friends are absent).
      - name: Render service suite (live library + the doubles it stands in for)
        env:
          # Turns "rendercv is missing or off-pin" from a skipped file into a hard failure —
          # the same trick the db job uses with HQ_REQUIRE_DB. A security suite that skips
          # reports green, and green is exactly what it must not report.
          HQ_REQUIRE_RENDERCV: "1"
        run: pytest tests/infra/test_render_live.py tests/infra/test_render_guards.py -q -p no:cacheprovider

  # The migrations, actually executed. tests/core/test_migrations.py reads the
  # SQL as text — enough to catch a function the app calls but nobody defined,
  # and blind to every logic error in the function body. This job applies the
  # schema to a real Postgres and runs the write path: idempotent replay,
  # optimistic concurrency, and the two-concurrent-writers race that acceptance
  # criterion 26 describes. None of that had ever been executed anywhere.
  db:
    name: db (migrations on real Postgres)
    needs: select
    if: needs.select.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        # Without this the job races the container and fails on connect.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt "psycopg[binary]==3.2.3"
      - name: Apply migrations and exercise the write path
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
          # Turns a missing DATABASE_URL into a hard failure instead of a
          # suite that skips every test and reports green.
          HQ_REQUIRE_DB: "1"
        run: pytest tests/db -q

  # The pinned-mutant ledger: every T3/T4 guard, broken on purpose, its named
  # test required to go red.
  #
  # WHY IT IS A JOB AND NOT A STEP. This repo's most expensive recurring defect
  # is a test that passes with the fix it guards removed — six occurrences on
  # 2026-08-02, across different authors including the coordinator. Every one of
  # them was caught by an author running the mutation BY HAND and every one of
  # them then left that mutation in a commit message, where it depends on
  # somebody's memory. `tests/mutants/manifest.toml` is those mutations as an
  # artifact and this is what executes them.
  #
  # It is deliberately the union of four other jobs' dependencies rather than a
  # step inside any of them: the ledger spans SQL, a .tsx class string, a shell
  # redirection and a Python fallthrough, and a mutant that cannot run in the
  # environment it is given would have to be skipped. A skipped mutant is the
  # same defect one level up, so the runner has no skip and this job carries
  # every dependency the ledger names.
  #
  # `uv` rather than setup-python: the runner resolves 3.11 and 3.12 itself, the
  # same way `scripts/verify.sh` does outside the image, so the CI invocation and
  # the local one are the same command.
  mutants:
    name: pinned mutants
    needs: select
    if: needs.select.outputs.mutants == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: webapp/package-lock.json }
      # The scratch worktree the runner builds borrows this rather than
      # installing a second copy; without it every browser mutant would fail on
      # "cannot find module" instead of on its mutation.
      - run: npm install --no-audit --no-fund
        working-directory: webapp
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        working-directory: webapp
      - name: Break every pinned guard and require its test to go red
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: python3 scripts/mutants.py

  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.smoke }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Live adapter smoke (from datacenter egress)
        run: python -m monitor.scripts.smoke_adapters

  whoami:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.whoami }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print client_email
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        # base64 so GitHub's secret masking doesn't redact it (it's a substring
        # of the JSON secret); client_email is an identifier, not a credential.
        run: python3 -c "import json,os,base64; print('SA_EMAIL_B64=' + base64.b64encode(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])['client_email'].encode()).decode())"

  bootstrap:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Bootstrap HQ sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          SA_EMAIL=$(python -c "import json,os; print(json.loads(os.environ['GOOGLE_SERVICE_ACCOUNT_JSON'])['client_email'])")
          SHEET_ID=$(python -c "import yaml; print(yaml.safe_load(open('hq.config.yaml'))['sheet_id'])")
          ARGS="--sheet-id $SHEET_ID --owner shaheensalmant@gmail.com --sa-email $SA_EMAIL"
          if [ "${{ inputs.seed_companies }}" = "true" ]; then ARGS="$ARGS --seed-companies"; fi
          python -m tracker.bootstrap $ARGS
      - name: Migrate history (legacy sheet + committed import CSVs)
        if: ${{ inputs.migrate_legacy }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.migrate --legacy --scout-csv --applog tracker/data/applog-import.csv
      - name: Commit gid registry
        run: |
          git config user.name "hq-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase origin ${{ github.ref_name }} || true
          git add hq.config.yaml || true
          git commit -m "chore: pin HQ sheet gids from bootstrap" || echo "no changes"
          git push || echo "nothing to push"

  migrate_simplify:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.migrate_simplify }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Import Simplify tracker CSV
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -m tracker.migrate --simplify-csv

  seed_jobs:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.seed_jobs }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    concurrency:
      # feed lanes are per-user now; this manual seed targets the default user
      group: hq-feed-writers-${{ vars.HQ_DEFAULT_USER || 'salman' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Full discovery sweep (all monitored companies)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.run
      - name: Tag any roles discovery left untagged
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.review
