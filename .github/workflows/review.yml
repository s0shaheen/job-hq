# Nightly tagging backfill: anything discovery couldn't tag inline (cap
# overflow, transient JD fetch failures) gets tagged here.
name: Tagging review

# SCHEDULE RETIRED 2026-07-25 — cron moved to AWS Lambda + EventBridge (jobs.review, 15:00 UTC).
# Note the Lambda job runs regate THEN review nightly; here regate stays dispatch-gated below.
on:
  workflow_dispatch:
    inputs:
      regate:
        description: "Re-gate every feed row against the current filter_* knobs first"
        type: boolean
        default: false

permissions:
  contents: read


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-review-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Re-gate feed (dispatch only)
        if: inputs.regate
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          PYTHONUNBUFFERED: "1"
        run: python -m monitor.regate
      - name: Tag untagged roles
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python -m monitor.review
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Tagging review failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
