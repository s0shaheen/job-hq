# Nightly self-heal + snapshot: re-asserts headers/dropdowns/protections/gids,
# then exports every tab to CSV and commits — the restore point that makes any
# human catastrophe a one-command rollback.
#
# STAYS ON GITHUB ACTIONS (the 2026-07-25 Lambda cutover moved every other cron off). Its
# product is a git commit: the CSV snapshots AND the re-pinned gids in hq.config.yaml. Lambda's
# /var/task is read-only, so both writes there are skipped — a backup that silently doesn't
# happen is worse than no backup. Rule for the split: if a job's output is a commit, it runs here.
name: Self-heal and snapshot

on:
  schedule:
    - cron: "23 8 * * *"   # 03:23 America/Chicago
  workflow_dispatch: {}

permissions:
  contents: write


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        # "" = the flat single-user registry (core.config treats an empty
        # HQ_USER as the flat doc). Set vars.HQ_USERS to name real lanes; no
        # user slug is hardcoded here (RM-40 vault audit §3c).
        user: ${{ fromJSON(vars.HQ_USERS || '[""]') }}

    concurrency:
      group: hq-selfheal-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Self-heal schema
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
        run: python -m tracker.selfheal
      - name: Snapshot tabs to CSV
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          # SHEET-SUNSET Phase C: this is the ONLY writer of the `snapshot` beat (the
          # git/Actions CSV lane), and under HQ_PG_WRITES=first_class the digest watches
          # that lane in BOTH stores. Without these four the lane runs, commits nightly,
          # and pages the operator every morning with "⚠ snapshot (pg): no heartbeat yet"
          # — a healthy backup reported dead, which is the cry-wolf traffic tests/conftest.py
          # calls a reliability bug. Unset in Phase A: the step behaves exactly as before.
          HQ_PG_WRITES: ${{ vars.HQ_PG_WRITES }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          HQ_PG_USER_ID: ${{ secrets.HQ_PG_USER_ID }}
        run: python -m tracker.snapshot
      - name: Commit snapshots + registry re-pins (snapshots branch, never main)
        # Vault-split Step 2 (docs/pilot-launch/20-personal-vault-audit.md §9, issue
        # #184): the restore point moves off main. A bot commit on main has no CI run
        # and a non-member author — on 2026-08-12 that blocked BOTH deploy paths, and
        # it is why main's tip was rarely deployable. The snapshots branch is the same
        # restore point under a different ref, INTERIM until the owner vault exists
        # and this lane leaves the repo. The code that RUNS is still main's checkout;
        # only the commit lands elsewhere. hq.config.yaml re-pins land there too — a
        # genuine gid change (rare) gets merged to main by hand, deliberately.
        run: |
          git config user.name "hq-bot"
          git config user.email "bot@users.noreply.github.com"
          git fetch origin +refs/heads/snapshots:refs/remotes/origin/snapshots || true
          if git rev-parse -q --verify refs/remotes/origin/snapshots >/dev/null; then
            git worktree add /tmp/snap -B snapshots origin/snapshots
          else
            git worktree add /tmp/snap -b snapshots   # first run: the branch starts at today's main
          fi
          rsync -a --delete --exclude=pg/ snapshots/ /tmp/snap/snapshots/
          cp hq.config.yaml /tmp/snap/hq.config.yaml
          cd /tmp/snap
          git add snapshots/ hq.config.yaml
          git commit -m "chore: nightly HQ snapshot ${{ matrix.user }} $(date -u +%Y-%m-%d)" || { echo "no changes"; exit 0; }
          for i in 1 2 3; do
            git push origin snapshots && break
            echo "push rejected (matrix leg race) — rebasing"; git pull --rebase origin snapshots
          done
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Self-heal failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/${{ secrets.HQ_OPS_NTFY_TOPIC }}" || true
