# Daily full discovery sweep across every monitored company (Companies tab),
# with inline tagging of new roles and YoE-filtered pushes.
name: Job monitor

on:
  schedule:
    - cron: "0 12 * * *"   # ~07:00 America/Chicago
  workflow_dispatch: {}

permissions:
  contents: write          # commits the daily snapshot (keeps cron alive too)

concurrency:
  group: hq-feed-writers
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run discovery
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          mkdir -p monitor/snapshots
          python -m monitor.run
      - name: Commit snapshot
        run: |
          git config user.name "hq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monitor/snapshots/ || true
          git commit -m "chore: daily snapshot $(date -u +%Y-%m-%d)" || echo "no changes"
          git push || echo "nothing to push"
      - name: Ops alert on failure
        if: failure()
        run: |
          curl -s -H "Title: Job monitor failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
