# Full discovery sweep across every monitored company (Companies tab), twice
# a day, with inline tagging of new roles and gate-filtered pushes.
#
# Twice daily over ALL companies replaced the old split of one daily sweep +
# an hourly watch over a handful of "priority" companies. The watch cost 18
# runs/day of billable Actions minutes to surface a posting a few hours
# sooner, and 6 of its 8 companies were unseeded and skipped every run
# anyway. Same-day discovery for the whole universe is the better trade.
name: Job monitor

# SCHEDULE RETIRED 2026-07-25 — the cron now lives on AWS Lambda + EventBridge
# (infra/terraform/variables.tf: jobs.monitor, 12:00 + 23:00 UTC). Kept dispatchable: same code,
# same secrets, one click. It is the manual re-run path the runbook points at AND the fallback if
# AWS itself is the problem — the only step Lambda can't do is the snapshot commit below, which
# therefore only refreshes on a dispatched run (see infra/README.md § Known gaps).
on:
  workflow_dispatch: {}

permissions:
  contents: write          # commits the daily snapshot (keeps cron alive too)


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-feed-writers-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # run_budget_min (Config, default 30) stops the sweep cleanly and flushes;
    # this outer timeout is the never-hit backstop, not the working limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Run discovery
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          mkdir -p monitor/snapshots
          python -m monitor.run
      - name: Commit snapshot
        run: |
          git config user.name "hq-bot"
          git config user.email "bot@users.noreply.github.com"
          git add monitor/snapshots/ || true
          git commit -m "chore: daily snapshot ${{ matrix.user }} $(date -u +%Y-%m-%d)" || echo "no changes"
          for i in 1 2 3; do
            git push && break
            echo "push rejected (matrix leg race) — rebasing"; git pull --rebase origin "${GITHUB_REF_NAME}"
          done
      - name: Ops alert on failure
        # cancelled() covers the timeout-minutes kill — a cancelled job is NOT
        # failure(), which is how six days of dead runs never paged anyone.
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Job monitor failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
