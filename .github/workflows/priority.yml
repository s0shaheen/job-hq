# Hourly watch on priority-tier companies (Companies tab, priority=TRUE):
# push within the hour a role posts. Skips overnight CT (no one reads a 3am
# alert; the 6am run and the daily sweep catch anything posted overnight).
name: Priority watch

on:
  schedule:
    - cron: "17 11-23,0-4 * * *"   # hourly at :17, ~06:00-23:00 America/Chicago
  workflow_dispatch: {}


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-feed-writers-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Watch priority companies
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.priority
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Priority watch failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
