# Watch on priority-tier companies (Companies tab, priority=TRUE).
#
# UNSCHEDULED as of 2026-07-21. The company-list-driven fast watch is retired:
# the main sweep now covers EVERY company twice a day, which is the same
# freshness for the 99% of the universe this watch ignored, at a fraction of
# the Actions minutes (this ran 18x/day). The mechanism is kept — dispatchable
# on demand, and ready if a genuinely time-critical tier is ever defined by
# something better than a hand-maintained company flag.
name: Priority watch

on:
  workflow_dispatch: {}


jobs:
  run:
    strategy:
      fail-fast: false   # one user's failure must never cancel another's run
      matrix:
        user: ${{ fromJSON(vars.HQ_USERS || '["salman"]') }}

    concurrency:
      group: hq-feed-writers-${{ matrix.user }}   # per-user lane: users never queue behind each other
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Watch priority companies
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          HQ_USER: ${{ matrix.user }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m monitor.priority
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: [${{ matrix.user }}] Priority watch failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
