# The pipeline joiner: promotions, quick-adds, scout sync, stale flags, and
# matching captured email events into Pipeline rows. Status *pushes* are
# instant via the Apps Script capture; this files them into the sheet.
name: Tracker

on:
  schedule:
    - cron: "31 */2 * * *"   # every 2h at :31 (off the top-of-hour load spike)
  workflow_dispatch: {}

concurrency:
  group: hq-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - name: Promote / quick-add / scout / stale / join
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python -m tracker.promote
          python -m tracker.quickadd
          python -m tracker.scout
          python -m tracker.stale
          python -m tracker.join
      - name: Ops alert on failure
        if: failure() || cancelled()
        run: |
          curl -s -H "Title: Tracker run failed" -H "Priority: high" -H "Tags: warning" \
            -d "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/REDACTED-NTFY-TOPIC" || true
