[[mutant]]
id = "today-row-button-decides-the-selection"
tier = "T2"
kind = "patch"
patch = "patches/today-row-button-decides-the-selection.patch"
guard = "webapp/app/(app)/queue/today-list.tsx — decideRow"
property = """
A row's own Interested/Pass/Later button decides THAT ROW, never the selection \
that happens to exist elsewhere on screen — the count on a control equals the \
count it acts on (02 section 8)."""
runner = "playwright"
spec = "tests/e2e/triage.spec.ts"
grep = "a row's own button decides that row"
failing = 1   # desktop only; the mobile project skips it, see ADD-018
# This shipped. The first cut of Today routed every row button through a helper
# that returned the SELECTION whenever one existed, so with rows 1-3 checked,
# clicking the button named `Interested: Vanta, ...` wrote rows 1-3, left Vanta
# undecided, and toasted "Marked 3 roles interested". The control's name, its
# position and its effect all disagreed, and the SelectionBar two inches away
# was obeying the rule at the same moment.
#
# `failing = 1` and not 2 because the mobile project skips this case: a
# non-cursor row reveals its actions on hover, which a touch device cannot do.
# That gap is ADD-018, and closing it means deleting the skip and raising this
# number — not baselining it.

[[mutant]]
id = "app-shell-unconditional-bounded-frame"
tier = "T3"
kind = "patch"
patch = "patches/app-shell-unconditional-bounded-frame.patch"
guard = "webapp/components/ds/app-shell.tsx — the opt-in bounded frame"
property = """
A surface that did not opt into the bounded frame keeps DOCUMENT scrolling, so \
a bottom-anchored toast can always be scrolled clear of the primary action on a \
phone."""
runner = "playwright"
spec = "tests/e2e/layout.spec.ts"
grep = "un-bounded surfaces"
failing = 8   # 4 un-bounded paths x 2 Playwright projects
# A FINDING, and the reason `companies.spec.ts` is NOT in this entry.
#
# The companies phone/toast case is the test that CAUGHT #121's mobile
# regression, so it was in the grep first and was expected to redden. It reddens
# on linux and does NOT redden on macOS — 9 red inside the verification image, 8
# on the host, from the same patch. That is not flakiness and it is not a bug in
# the ledger: the test's own comment says so ("it passed on macOS and failed on
# CI because whether the preview pushes the button far enough depends on how the
# copy above it wraps, which is a font question"). The paste form's bottom safe
# area leaves the submit button clear under the bounded frame at macOS metrics
# and does not at linux metrics.
#
# A pinned count has to mean the same thing in both environments this runs in,
# so the entry pins `layout.spec.ts`, which reddens 8/8 in both. The standing
# fact is recorded rather than averaged away: on macOS the frame regression is
# guarded by `layout.spec.ts` ALONE, and anyone relying on the companies case to
# catch it locally is relying on a font.

