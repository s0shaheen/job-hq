# ═════════════════════════════════════════════════════ 4. the runner's control
#
# A ledger of mutants that all redden proves the guards work. It does not prove
# the RUNNER can tell. This patch changes a comment and nothing else, and the
# runner must report it as a FAILURE for reddening nothing. `scripts/mutants.py`
# exits non-zero if this control passes, which is the inversion that makes every
# green run above mean something.

[[control]]
id = "INERT-comment-only"
kind = "patch"
patch = "patches/INERT-comment-only.patch"
property = "A patch that changes only a comment must be REPORTED AS A FAILURE by this runner."
runner = "pytest"
tests = ["tests/core/test_land_script.py::test_stdout_carries_only_the_result_not_the_narration"]
failing = 1

# ═══════════════════════════ 5. what binds the owner lane, and what does not
#
# The original brief for this ledger asked for TWO mutants per protected table:
# the policy dropped, and FORCE ROW LEVEL SECURITY removed — the second to catch
# the table-owner bypass a dropped-policy mutant alone misses. This ledger
# carried the second as a `[[gap]]` for exactly one day, on the reasoning that
# no migration sets FORCE, so there was no guard there to break.
#
# PR #149 then measured it, and the gap was wrong to imply forcing was the fix:
#
#   * FORCE is INERT here. On a real supabase/postgres the role `db/apply.sh`
#     connects as — the owner of all 31 tables and of every definer in `public` —
#     has `rolbypassrls = true`. A forced table with a `using (false)` policy
#     still returned its rows to that owner. Locally the owner is a superuser and
#     bypasses for its own reason. The ALTER is a no-op in both places.
#   * And if it ever bit, it would take the product down. There is no permissive
#     insert/update/delete policy anywhere in this schema; every write runs
#     through a definer AS THE OWNER, and an empty permissive set is a deny.
#     Reproduced: forcing turned signup and `app_save_view` into
#     "new row violates row-level security policy".
#
# So the owner lane is bound by `hq_entitlement_guard`, a ROW TRIGGER, because
# triggers fire for the owner. Which means the second mutant per table is not
# "FORCE removed" — it is "the entitlement trigger dropped", and this ledger
# already pins it as `autopilot-stages-entitlement-trigger-dropped`, driven
# through the definer RPC that is the path an owner-lane write actually takes.
#
# The `[[gap]]` mechanism stays in `scripts/mutants.py` (a property nobody could
# pin, executed with the expectation inverted, so the day the guard arrives the
# entry fails and must be promoted). Nothing uses it today, which is the correct
# state: a gap that has been answered is deleted, not kept as decoration.
