[[mutant]]
id = "autopilot-normalise-drops-case-boundary"
tier = "T3"
kind = "patch"
patch = "patches/autopilot-normalise-drops-case-boundary.patch"
guard = "public.hq_autopilot_normalise_field_key(text)"
property = """
A protected-characteristic question is refused in BOTH conventions a provider \
writes it in, because the two spellings normalise to one string before the \
pattern registry sees either — not because the registry happens to list both."""
runner = "pytest"
needs = ["database"]
tests = [
  "tests/db/test_autopilot_staging.py::test_the_engine_lane_gets_the_camelcase_refusal_too",
  "tests/db/test_autopilot_staging.py::test_mutation_normalising_without_the_case_boundary_lets_camelcase_through",
]
failing = 2
# The second named test applies this same mutation itself and calls `_restore()`
# in a `finally`. That restore re-applies the migration FILE, so a runtime-DDL
# mutant would be undone mid-test and the test would stay green. Patching the
# migration source is what makes `_restore` restore the MUTATED guard, which is
# why this entry is `kind = "patch"` and not `kind = "sql"`.

