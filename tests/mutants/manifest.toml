# The pinned-mutant ledger.
#
# WHY THIS FILE EXISTS. This repo's most expensive recurring defect is a test
# that passes with the fix it guards removed: six occurrences on 2026-08-02
# alone, across different authors including the coordinator. The convention
# "every guard ships with the mutation the author ran by hand" caught all six,
# so the mechanism works. What fails is that the mutation then lives in prose in
# a commit message and depends on somebody's memory. This file is that mutation,
# committed and executable.
#
# WHY A PATCH AND NOT A MUTATION-TESTING TOOL. Three of the six defects were in
# SQL, one in a `.tsx` class string, one in a shell redirection. No Python or
# TypeScript mutation tool reaches any of those, and whole-repo mutation testing
# in PR CI is abandoned everywhere it has been tried because the runtime is
# quadratic in the wrong thing. A committed patch is language-agnostic and says
# exactly which mutation this guard exists to catch, which a generated mutant
# never can.
#
# WHY NOT A COVERAGE GATE. Four of the six tests FULLY COVERED the line they
# failed to guard. Coverage measures execution; this measures consequence.
#
# SCOPE. T3/T4 guards only (see `docs/pilot-launch/14-work-packet-standard.md`
# section 4): migration, RLS, RPC, storage, worker, provider, and the release
# path. This is deliberately not a ledger of every test in the repo.
#
# HOW TO ADD ONE.
#
#   1. Break the guard in your working tree the way a careless change would.
#   2. `git diff -- <file> > tests/mutants/patches/<id>.patch`, then revert.
#   3. Add a `[[mutant]]` below naming the tests that must go red and the
#      property in one line.
#   4. `scripts/mutants.py --only <id>` and read the evidence.
#
# PATCH ROT IS MAINTENANCE, NOT BREAKAGE.
#
# A patch is written against specific lines of a specific file, so editing the
# guard makes it stop applying. That is the ledger noticing, on purpose, and the
# expected rate is roughly one repair per active week — main moved that much in
# hours on 2026-08-02. `mutants-dry` in `scripts/verify.sh` is mapped to every
# file a pinned mutant patches, so it fires sub-second on the change that caused
# it rather than at the end of a CI run.
#
# To refresh one:
#
#   1. Read the entry's `property` FIRST. The question is not "make the patch
#      apply again", it is "does this mutation still reverse the guard this
#      property is about". If the guard moved, the mutation moves with it; if
#      the guard is gone, the entry is deleted with a note saying why.
#   2. Break the guard again in your working tree.
#   3. git diff -- <file> > tests/mutants/patches/<id>.patch
#   4. git checkout -- <file>
#   5. scripts/mutants.py --only <id>, and check the `failing` count still
#      matches. A count that moved is a finding: the guard or its test changed
#      underneath the entry, and that is worth a line in the PR rather than a
#      silent edit.
#
# THE RULES THE RUNNER ENFORCES, each of which is a failure mode:
#
#   * A patch that no longer applies FAILS. It never skips. A skipped mutant is
#     the same bug one level up.
#   * A patch that touches `tests/**` is REFUSED at load time, before anything
#     runs. Otherwise the cheapest way to satisfy this ledger is to break a test
#     file, which proves nothing about any guard.
#   * A mutant whose named tests do not go red FAILS and names the guard. That
#     failure is the entire discovery this ledger exists to produce.
#   * `failing` is the number of test CASES that must go red. A mutant that
#     reddens one of four parametrisations has found a partial guard, and the
#     count is what says so.

