# Was 8. The Applications cutover added `/pipeline` to the sweep in
# layout.spec.ts, because the list was one surface short of what its own comment
# claims: /pipeline is the surface most likely to be handed the frame by mistake
# (a dense list, which is what the frame LOOKS like it is for) and it is not
# virtualized, so it has no claim on one. An accidental opt-in there went
# undetected until then. Strengthening the guard moves the pinned count with it —
# an exact match is the point, so a guard that grows has to say so here.
# A FINDING, and the reason `companies.spec.ts` is NOT in this entry.
#
# The companies phone/toast case is the test that CAUGHT #121's mobile
# regression, so it was in the grep first and was expected to redden. It reddens
# on linux and does NOT redden on macOS — 9 red inside the verification image, 8
# on the host, from the same patch. That is not flakiness and it is not a bug in
# the ledger: the test's own comment says so ("it passed on macOS and failed on
# CI because whether the preview pushes the button far enough depends on how the
# copy above it wraps, which is a font question"). The paste form's bottom safe
# area leaves the submit button clear under the bounded frame at macOS metrics
# and does not at linux metrics.
#
# A pinned count has to mean the same thing in both environments this runs in,
# so the entry pins `layout.spec.ts`, which reddens 8/8 in both. The standing
# fact is recorded rather than averaged away: on macOS the frame regression is
# guarded by `layout.spec.ts` ALONE, and anyone relying on the companies case to
# catch it locally is relying on a font.

