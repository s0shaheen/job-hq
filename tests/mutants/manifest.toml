# The next three pin the `anon` SELECT revoke (`*_anon_select_revoke.sql`). The
# first two are a PAIR on purpose: that migration has two halves which fail
# independently, and either half alone leaves a guard that looks complete and is
# not. The third pins the QUESTION the guard asks rather than a half of the
# migration.
#
# All three set `restore`, because re-applying the autopilot migration would not
# put a revoked grant back — the exact "a restore that names the wrong file is
# not a restore" failure recorded at DEFAULT_SQL_RESTORE.
#
# That the restore is SOUND was measured rather than assumed: `revoke select on
# all tables in schema public from anon` does clear a column-level grant
# (has_column_privilege True -> False across it). Had it not, the column mutant
# below would survive its own restore and poison every later test in the session
# while still reporting `restored = true`.

